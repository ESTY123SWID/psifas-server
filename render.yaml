# Render Blueprint for Psifas — both services on FREE plans.
#
#   psifas      → static site (React client)  https://psifas.onrender.com
#   psifas-api  → web service (this API)      https://psifas-api.onrender.com
#
# The static site forwards /api/* to the API, so the browser sees ONE site: the session cookie is
# first-party (works in Safari too) and no cross-site CORS is needed.
#
# Secrets are never stored here:
#   - JWT_SECRET is generated by Render (generateValue).
#   - DATABASE_URL (Neon) and CLOUDINARY_URL are entered once in Render's own form (sync: false).

services:
  - type: web
    name: psifas-api
    runtime: node
    plan: free
    region: frankfurt # same region as the Neon database
    branch: main
    # Dev dependencies (Prisma CLI, TypeScript) are needed to build; migrations run on every deploy.
    buildCommand: npm ci --include=dev && npm run build && npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /health # does not touch the database, so Neon can still auto-suspend
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.17.0
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: cloudinary
      - key: CLIENT_ORIGINS
        value: https://psifas.onrender.com
      - key: API_PUBLIC_URL
        value: https://psifas.onrender.com/api
      - key: COOKIE_SAMESITE
        value: lax
      - key: TRUST_PROXY
        value: "1"

  - type: web
    name: psifas
    runtime: static
    repo: https://github.com/ESTY123SWID/psifas-client
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: VITE_API_URL
        value: /api
    routes:
      # The API, through the same origin as the site.
      - type: rewrite
        source: /api/*
        destination: https://psifas-api.onrender.com/api/*
      # Client-side routing (React Router): every other path serves the app.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
